<!DOCTYPE html>
<html>
<head>
    <title>{{ .title }}</title>
</head>
<body>
<h1>{{ .title }}</h1>
<p>환영합니다!</p>
<button onclick="data()">JSON하이체킹 방지된 응답 받기</button>
</body>
<script>
    function data() {
        fetch('/data')
            .then(response => response.text()) // 1. 텍스트로 먼저 받음
            .then(text => {
                // 2. 접두사 제거 (secureJsonPrefix에서 설정한 문자열)
                const prefix = "while(1);";
                const cleanedText = text.startsWith(prefix) ? text.substring(prefix.length) : text;

                // 3. JSON으로 파싱
                const data = JSON.parse(cleanedText);
                console.log(data); // ["lena", "austin", "foo"]
            })
            .catch(error => console.error('Error:', error));
    }
</script>
</html>
